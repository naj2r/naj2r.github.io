project:
  type: website
  output-dir: docs
  # Quarto only copies a file into docs/ when a page links to it. The job market
  # paper's title page links to nicholas-jensen.com/files/jensen-absinthe.pdf,
  # and that link is baked into every copy already sent out, so the file must
  # always ship - even while the site's own buttons point at Dropbox.
  resources:
    - files/jensen-absinthe.pdf

website:
  title: "Nicholas A. Jensen"
  description: "Nicholas Jensen's Personal Website - Economist"
  site-url: https://nicholas-jensen.com
  favicon: images/Thumbnail.png
  navbar:
    background: "#2c3e50"
    foreground: "#ecf0f1"
    left:
      - href: index.qmd
        text: Home
      - href: research/index.qmd
        text: Research & Publications
      - href: teaching.qmd
        text: Teaching
      # - href: talks.qmd
      #   text: Talks
    right:
      - href: cv.qmd
        text: CV
      - icon: github
        href: https://github.com/naj2r
      - icon: linkedin
        href: https://www.linkedin.com/in/nicholas-a-jensen
      - icon: newspaper
        href: https://trialbystandarderrors.substack.com
  page-footer:
    center: "&copy; 2024-2026 Nicholas A. Jensen"

format:
  html:
    theme: [flatly, styles.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
